---
# Postgres Deployment
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: url-parser-fuzzing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: parser-postgres
          image: postgres:16-alpine
          imagePullPolicy: Always
          args:
            - "-c"
            - "max_connections=2000"
            - "-c"
            - "shared_buffers=1GB"
            - "-c"
            - "work_mem=2MB"
            - "-c"
            - "maintenance_work_mem=256MB"
            - "-c"
            - "effective_cache_size=4GB"
            - "-c"
            - "synchronous_commit=off"
            - "-c"
            - "wal_buffers=64MB"
            - "-c"
            - "checkpoint_completion_target=0.9"
            - "-c"
            - "random_page_cost=1.1"
            - "-c"
            - "effective_io_concurrency=200"
            - "-c"
            - "commit_delay=10000"
            - "-c"
            - "commit_siblings=10"
          env:
            - name: POSTGRES_DB
              value: url_parser
            - name: POSTGRES_PASSWORD
              value: PLACEHOLDER_CHANGE_BEFORE_REPRO
            - name: POSTGRES_USER
              value: parser
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          livenessProbe:
            exec:
              command:
                - "pg_isready"
                - "-U"
                - "parser"
                - "-d"
                - "url_parser"
            failureThreshold: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "8"
              memory: "32Gi"
            limits:
              cpu: "8"
              memory: "32Gi"
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
# Postgres Persistent Volume Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: url-parser-fuzzing
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Ti

---
# Postgres Service
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: url-parser-fuzzing
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432

---
# Redis Deployment
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: url-parser-fuzzing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: parser-redis
          image: redis:7-alpine
          args:
            - redis-server
            - --appendonly
            - "no"
            - --save
            - ""
            - --stop-writes-on-bgsave-error
            - "no"
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            failureThreshold: 5
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /data
              name: redis-data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
---
# Redis Persistent Volume Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: redis-data
  name: redis-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: url-parser-fuzzing
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
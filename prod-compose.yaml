---
apiVersion: v1
kind: Namespace
metadata:
 name: url-parser-fuzzing
---
# Worker Deployment
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ada-worker
  namespace: url-parser-fuzzing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ada-worker
  template:
    metadata:
      labels:
        app: ada-worker
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: ada-worker
          image: registry.example.com/url-parser-ada:latest
          imagePullPolicy: Always
          env:
            - name: WORKER_LANGUAGE
              value: "ada"
            - name: CELERY_CONCURRENCY
              value: "10"
            - name: DB_DRIVER
              value: postgresql
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              value: url_parser
            - name: DB_PASSWORD
              value: PLACEHOLDER_CHANGE_BEFORE_REPRO
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: parser
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "2Gi"   
